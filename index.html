<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Party Poll</title>
<meta property="og:title" content="🎂 Birthday party — pick your days">
<meta property="og:description" content="Tap the days you can come. Takes 10 seconds.">
<meta name="theme-color" content="#0d0a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a14;
    --card: #1a1424;
    --card-hi: #241b33;
    --line: #2f2541;
    --text: #f6f1ff;
    --muted: #a99bbf;
    --pink: #ff4fa3;
    --gold: #ffc84a;
    --yes: #3ee08f;
    --maybe: #ffc84a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(600px 300px at 15% -5%, rgba(255,79,163,.22), transparent 70%),
      radial-gradient(500px 280px at 100% 10%, rgba(255,200,74,.14), transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    font: 16px/1.45 Inter, system-ui, sans-serif;
    min-height: 100vh;
  }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800; font-size: clamp(34px, 9vw, 46px); line-height: 1.02;
    margin: 0 0 10px; letter-spacing: -.02em;
  }
  h1 .hl {
    background: linear-gradient(90deg, var(--pink), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); margin: 0 0 28px; }
  h2 {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800; font-size: 20px; margin: 36px 0 12px;
  }
  label.fl { display: block; font-weight: 600; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 14px 16px; font: inherit; color: var(--text);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--pink); }
  .hint { font-size: 13px; color: var(--muted); margin: 18px 0 10px; }
  .hint b { color: var(--yes); } .hint i { color: var(--maybe); font-style: normal; font-weight: 600; }
  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .day {
    position: relative; border-radius: 16px;
    background: var(--card); border: 1.5px solid var(--line);
    transition: border-color .15s, background .15s;
  }
  .day .tap {
    display: block; width: 100%; text-align: left; cursor: pointer; user-select: none;
    padding: 14px; font: inherit; color: var(--text); background: none; border: 0;
    transition: transform .1s;
  }
  .day .tap:active { transform: scale(.97); }
  .day select {
    display: block; width: calc(100% - 20px); margin: -4px 10px 10px; padding: 8px 10px;
    font: 600 14px Inter, sans-serif; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .day .dow { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .day .date { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 22px; }
  .day .tag { font-size: 12px; color: var(--pink); font-weight: 600; min-height: 16px; }
  .day .state { position: absolute; top: 12px; right: 12px; font-weight: 800; font-size: 18px; }
  .day[data-s="yes"] { border-color: var(--yes); background: rgba(62,224,143,.10); }
  .day[data-s="yes"] .state { color: var(--yes); }
  .day[data-s="maybe"] { border-color: var(--maybe); background: rgba(255,200,74,.09); }
  .day[data-s="maybe"] .state { color: var(--maybe); }
  .btn {
    width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 16px; cursor: pointer;
    font: 700 17px Inter, sans-serif; color: #1a0710;
    background: linear-gradient(90deg, var(--pink), var(--gold));
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { text-align: center; font-size: 14px; margin-top: 10px; min-height: 20px; color: var(--muted); }
  .msg.ok { color: var(--yes); } .msg.err { color: #ff6b6b; }
  .res { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .row.best { border-color: var(--gold); background: var(--card-hi); }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row .when { font-weight: 600; }
  .row .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .row .count b { color: var(--text); font-size: 16px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); margin: 8px 0; overflow: hidden; display: flex; }
  .bar .y { background: var(--yes); } .bar .m { background: var(--maybe); opacity: .8; }
  .names { font-size: 13px; color: var(--muted); }
  .names .ny { color: var(--text); }
  .names .t { color: var(--gold); font-weight: 600; }
  .allby { font-size: 13px; color: var(--yes); margin-top: 6px; }
  .empty { color: var(--muted); font-size: 14px; }
  .who { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .demo { margin-top: 32px; padding: 10px 14px; border-radius: 12px; font-size: 13px;
    background: rgba(255,200,74,.1); color: var(--gold); border: 1px dashed rgba(255,200,74,.4); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main>
  <h1>🎂 Birthday<br><span class="hl">party time</span></h1>
  <p class="sub">Tap every day you could make it. Takes 10 seconds.</p>

  <label class="fl" for="name">Your name</label>
  <input id="name" type="text" maxlength="30" placeholder="e.g. Sam" autocomplete="given-name">

  <p class="hint">Tap once = <b>✓ can come</b> · twice = <i>? maybe</i> · three times = clear. Then pick from what time.</p>
  <div class="days" id="days"></div>

  <button class="btn" id="save">Send my days 🎉</button>
  <div class="msg" id="msg"></div>

  <h2>Who's free when</h2>
  <div class="res" id="results"><p class="empty">Loading…</p></div>
  <p class="who" id="who"></p>

  <div class="demo" id="demo" hidden>Test mode: votes are only saved on this device. Add a Firebase database link to share them with everyone.</div>
</main>

<script>
// ---- Settings: edit these ----
// Firebase Realtime Database URL, e.g. "https://party-poll-1234-default-rtdb.europe-west1.firebasedatabase.app"
const DB_URL = "https://party-poll-d5b90-default-rtdb.europe-west1.firebasedatabase.app";
const POLL_ID = "bday-2026";
const FIRST_DAY = "2026-10-28";
const NUM_DAYS = 14;
const TAGS = { "2026-10-30": "🎂 the day", "2026-10-31": "🎃 Halloween" };
const DAYS = Array.from({ length: NUM_DAYS }, (_, i) => {
  const d = new Date(FIRST_DAY + "T12:00:00");
  d.setDate(d.getDate() + i);
  const id = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return {
    id,
    dow: d.toLocaleDateString("en-US", { weekday: "short" }),
    date: d.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
    tag: TAGS[id] || "",
  };
});
// -------------------------------

const $ = (id) => document.getElementById(id);
const CYCLE = { undefined: "yes", yes: "maybe", maybe: undefined };
const MARK = { yes: "✓", maybe: "?" };
const HOURS = Array.from({ length: 12 }, (_, i) => `${String(i + 12).padStart(2, "0")}:00`); // 12:00–23:00
let picks = {};
let times = {};
let votes = {};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Each person is one key, so two people voting at once never overwrite each other.
const keyFor = (name) => name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, "").replace(/\s+/g, "_").slice(0, 40);

const api = DB_URL ? {
  async load() {
    const r = await fetch(`${DB_URL}/polls/${POLL_ID}/votes.json`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    return (await r.json()) || {};
  },
  async save(key, entry) {
    const r = await fetch(`${DB_URL}/polls/${POLL_ID}/votes/${encodeURIComponent(key)}.json`,
      { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
    if (!r.ok) throw new Error(r.status);
  },
} : {
  async load() { return JSON.parse(store.get("demo-votes") || "{}"); },
  async save(key, entry) {
    const all = JSON.parse(store.get("demo-votes") || "{}");
    all[key] = entry;
    store.set("demo-votes", JSON.stringify(all));
  },
};

function renderDays() {
  $("days").innerHTML = "";
  for (const d of DAYS) {
    const card = document.createElement("div");
    card.className = "day";
    if (picks[d.id]) card.dataset.s = picks[d.id];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tap";
    b.innerHTML = `<div class="dow">${d.dow}</div><div class="date">${d.date}</div>
      <div class="tag">${d.tag}</div><div class="state">${MARK[picks[d.id]] || ""}</div>`;
    b.onclick = () => {
      const next = CYCLE[picks[d.id]];
      if (next) picks[d.id] = next; else { delete picks[d.id]; delete times[d.id]; }
      renderDays();
    };
    card.appendChild(b);
    if (picks[d.id]) {
      const sel = document.createElement("select");
      sel.setAttribute("aria-label", `From what time on ${d.date}`);
      sel.innerHTML = `<option value="">from any time</option>` +
        HOURS.map((h) => `<option value="${h}"${times[d.id] === h ? " selected" : ""}>from ${h}</option>`).join("");
      sel.onchange = () => { if (sel.value) times[d.id] = sel.value; else delete times[d.id]; };
      card.appendChild(sel);
    }
    $("days").appendChild(card);
  }
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function renderResults() {
  const people = Object.values(votes).filter((v) => v && v.name);
  if (!people.length) {
    $("results").innerHTML = `<p class="empty">No votes yet. Be the first 👀</p>`;
    $("who").textContent = "";
    return;
  }
  const label = (p, id) => esc(p.name) + (p.times?.[id] ? ` <span class="t">${p.times[id]}+</span>` : "");
  const rows = DAYS.map((d) => {
    const yesP = people.filter((p) => p.picks?.[d.id] === "yes");
    const maybeP = people.filter((p) => p.picks?.[d.id] === "maybe");
    // The latest "from" time among the yes votes is when everyone who said yes is there.
    const allBy = yesP.map((p) => p.times?.[d.id]).filter(Boolean).sort().pop();
    return {
      d, allBy,
      yes: yesP.map((p) => label(p, d.id)),
      maybe: maybeP.map((p) => label(p, d.id)),
      score: yesP.length + maybeP.length * 0.5,
    };
  });
  const top = Math.max(...rows.map((r) => r.score));
  const n = people.length;
  $("results").innerHTML = rows.map((r) => {
    const best = top > 0 && r.score === top;
    const names = [...r.yes.map((x) => `<span class="ny">${x}</span>`), ...r.maybe.map((x) => `${x} (maybe)`)].join(", ");
    return `<div class="row${best ? " best" : ""}">
      <div class="top"><span class="when">${best ? "👑 " : ""}${r.d.dow} ${r.d.date}${r.d.tag ? " · " + r.d.tag : ""}</span>
      <span class="count"><b>${r.yes.length}</b> yes${r.maybe.length ? ` · ${r.maybe.length} maybe` : ""}</span></div>
      <div class="bar"><div class="y" style="width:${(r.yes.length / n) * 100}%"></div><div class="m" style="width:${(r.maybe.length / n) * 100}%"></div></div>
      <div class="names">${names || "nobody yet"}</div>
      ${r.allBy && r.yes.length > 1 ? `<div class="allby">everyone who said yes is free from ${r.allBy}</div>` : ""}</div>`;
  }).join("");
  $("who").textContent = `${n} ${n === 1 ? "person has" : "people have"} voted: ${people.map((p) => p.name).join(", ")}`;
}

async function refresh() {
  try { votes = await api.load(); renderResults(); }
  catch { if (!Object.keys(votes).length) $("results").innerHTML = `<p class="empty">Couldn't load votes. Check your connection.</p>`; }
}

$("save").onclick = async () => {
  const name = $("name").value.trim();
  const msg = $("msg");
  msg.className = "msg";
  if (!name) { msg.textContent = "Put your name first 👆"; msg.classList.add("err"); $("name").focus(); return; }
  if (!Object.keys(picks).length) { msg.textContent = "Tap at least one day"; msg.classList.add("err"); return; }
  $("save").disabled = true;
  try {
    const key = keyFor(name) || "anon";
    await api.save(key, { name, picks, times, at: Date.now() });
    store.set("my-name", name);
    store.set("my-picks", JSON.stringify(picks));
    store.set("my-times", JSON.stringify(times));
    msg.textContent = "Saved! You can come back and change it anytime.";
    msg.classList.add("ok");
    confetti();
    await refresh();
  } catch {
    msg.textContent = "Didn't save, try again";
    msg.classList.add("err");
  }
  $("save").disabled = false;
};

function confetti() {
  const c = $("confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#ff4fa3", "#ffc84a", "#3ee08f", "#8f7bff", "#ffffff"];
  const bits = Array.from({ length: 120 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.4,
    vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, col: colors[(Math.random() * colors.length) | 0],
  }));
  const end = performance.now() + 2600;
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.vy += 0.05; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.col; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    if (t < end) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(performance.now());
}

// Bring back this person's previous answers so they can edit them.
$("name").value = store.get("my-name") || "";
try { picks = JSON.parse(store.get("my-picks") || "{}") || {}; } catch { picks = {}; }
try { times = JSON.parse(store.get("my-times") || "{}") || {}; } catch { times = {}; }
$("demo").hidden = !!DB_URL;
renderDays();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
